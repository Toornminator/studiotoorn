<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>OG Image Generator — Studio Toorn</title>
<link href="https://api.fontshare.com/v2/css?f[]=boska@300,400,401&f[]=general-sans@400,500&display=swap" rel="stylesheet">
<style>
  body { margin: 0; padding: 0; background: #f5f0e4; }
  .og {
    width: 1200px; height: 630px; position: relative; overflow: hidden;
    background:
      radial-gradient(ellipse 70% 55% at 88% 112%, rgba(201,161,85,.28) 0%, transparent 60%),
      radial-gradient(ellipse 50% 40% at 8% -10%, rgba(201,161,85,.16) 0%, transparent 60%),
      #f5f0e4;
    font-family: 'General Sans', system-ui, sans-serif;
    box-sizing: border-box;
    padding: 64px 80px;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .og::before {
    content: ''; position: absolute; inset: 0; opacity: .05; pointer-events: none;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    mix-blend-mode: multiply;
  }
  .dust { position: absolute; border-radius: 50%; background: #9a7627; pointer-events: none; }

  .brand { display: flex; align-items: center; gap: 16px; }
  .mono {
    width: 44px; height: 44px; background: #211b10;
    -webkit-mask: url('images/monogram-small.png') center/contain no-repeat;
    mask: url('images/monogram-small.png') center/contain no-repeat;
  }
  .name {
    font-family: 'Boska', Georgia, serif;
    font-size: 24px; letter-spacing: .32em; text-transform: uppercase;
    color: #211b10; font-weight: 400;
  }

  h1 {
    margin: 0; font-family: 'Boska', Georgia, serif; font-weight: 300;
    font-size: 88px; line-height: 1.1; letter-spacing: -.015em; color: #211b10;
  }
  h1 em { font-style: italic; color: #9a7627; }
  .pill {
    display: inline-block; width: 168px; height: 60px; border-radius: 999px;
    overflow: hidden; vertical-align: -4px; margin: 0 6px;
    box-shadow: 0 14px 30px -12px rgba(33,27,16,.45);
  }
  .pill img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .foot {
    border-top: 1px solid rgba(154,118,39,.3); padding-top: 26px;
    display: flex; justify-content: space-between; align-items: baseline;
  }
  .foot span {
    font-size: 15px; letter-spacing: .3em; text-transform: uppercase;
    color: #7a5d1d; font-weight: 500;
  }
  .foot b { font-weight: 500; color: rgba(33,27,16,.55); font-size: 15px; letter-spacing: .18em; }
</style>
</head>
<body>

<div class="og" id="og-capture">
  <div class="dust" style="top:120px;left:740px;width:5px;height:5px;opacity:.3"></div>
  <div class="dust" style="top:210px;left:1080px;width:4px;height:4px;opacity:.25"></div>
  <div class="dust" style="top:480px;left:180px;width:5px;height:5px;opacity:.22"></div>
  <div class="dust" style="top:90px;left:330px;width:3px;height:3px;opacity:.3"></div>
  <div class="dust" style="top:400px;left:1130px;width:6px;height:6px;opacity:.2"></div>
  <div class="dust" style="top:540px;left:920px;width:4px;height:4px;opacity:.28"></div>

  <div class="brand">
    <div class="mono"></div>
    <div class="name">Studio Toorn</div>
  </div>

  <h1>
    A digital studio<span class="pill"><img src="https://images.unsplash.com/photo-1414235077428-338989a2e8c0?auto=format&fit=crop&w=400&q=80" alt=""></span><br>
    run like a <em>Michelin kitchen.</em>
  </h1>

  <div class="foot">
    <span>Digital atelier · Costa del Sol</span>
    <b>studiotoorn.com</b>
  </div>
</div>

</body>
</html>
