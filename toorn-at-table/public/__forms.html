<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Netlify form definitions</title>
  </head>
  <body>
    <!--
      This page exists only so Netlify's build bot can discover the
      forms used on the site and provision submission endpoints +
      a dashboard view for them.

      Do not link to it from anywhere; do not style it. The real forms
      (contact/booking in src/components/contact/BookingForm.tsx, plus the
      order and newsletter forms) submit straight to Netlify Forms; their
      submissions land in the Netlify Forms dashboard.

      Keep the input names IDENTICAL to BookingForm.tsx field names —
      Netlify validates that the runtime submission matches the
      discovered field set.
    -->
    <form name="contact" method="POST" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input type="text" name="bot-field" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="eventType" />
      <input type="date" name="eventDate" />
      <input type="number" name="guests" />
      <input type="text" name="location" />
      <textarea name="message"></textarea>
    </form>

    <form name="order" method="POST" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="order" />
      <input type="text" name="bot-field" />
      <input type="text" name="name" />
      <input type="tel" name="phone" />
      <input type="email" name="email" />
      <input type="text" name="address" />
      <input type="number" name="portions" />
      <input type="text" name="deliveryTime" />
      <textarea name="allergies"></textarea>
      <input type="text" name="menu" />
    </form>

    <form name="newsletter" method="POST" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="newsletter" />
      <input type="text" name="bot-field" />
      <input type="email" name="email" />
      <input type="text" name="locale" />
      <input type="text" name="source" />
    </form>
  </body>
</html>
